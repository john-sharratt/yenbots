# Yen Bot's service config, as it runs on BlackWorld (docs/running.md).
site_name: Yen Bot
bind: "127.0.0.1:8096"
data_dir: "D:/yenbot/data"
live_dir: "D:/yenbot/live"
# The admins, by Google address: they approve accounts and see every app's data.
admins:
  - yensharratt@gmail.com
  - johnathan.sharratt@gmail.com
# A new account waits for an admin's approval.
registration: approve
# Yen's time zone: repeat rules, `ctx.time` and the backups' names read it.
time_zone: Australia/Sydney
# The gateway's bus on this machine: every push to the repository arrives on
# `repo/yenbot`, and the live checkout is fast-forwarded (docs/running.md).
bus:
  url: "ws://127.0.0.1/gateway/events"
  key_file: "D:/yenbot/secrets/gateway.key"
