tiles/bell-coral:
  tags: [bell, reminders, alarm]
  seed: 5312857441547061
  prompt: >-
    A flat vector illustration. The whole picture, edge to edge, is one plain
    flat field of soft coral orange with no border and no frame. In the centre
    sits a single golden-yellow bell with a small round clapper, drawn with
    simple rounded shapes, smooth edges and no outlines. The bell has gentle
    two-tone shading: lighter yellow on its upper left, a slightly deeper amber
    on its lower right, and a small cream highlight curving along its upper
    left side. A soft long shadow in a darker coral falls from the bell down to
    the lower right. Even, diffuse light from the upper left. The bell takes up
    about half of the picture, centred, seen straight on, with plenty of plain
    coral around it. A clean, modern, friendly flat vector style with a limited
    warm palette of coral, amber and cream.
illustrations/cooking:
  tags: [cooking, kitchen, food, recipes]
  seed: 3213578085151234
  prompt: >-
    A flat vector illustration of a home kitchen scene, wide. On a warm wooden
    counter in the middle stand a teal cooking pot with steam curling from it,
    a round cutting board with sliced carrots and green herbs, a small bowl of
    red tomatoes and a wooden spoon. Behind the counter, a simple window with a
    sage green potted plant on its sill and two open shelves holding cream jars
    and coral mugs. Drawn with simple rounded shapes, smooth edges and no
    outlines, with gentle two-tone shading on each object and soft long shadows
    falling to the lower right. Even, diffuse light from the upper left. The
    background wall is a plain soft cream. The palette is limited and warm:
    coral, rose, amber, sage green, teal, sky blue and cream. The scene is
    uncluttered, with calm empty space above the shelves. A clean, modern,
    friendly flat vector style.
