[package]
name = "yenbot"
version = "0.1.0"
edition = "2021"
description = "Yen Bots — the app-hosting site at yenbot.com.au: one binary serving the platform, its apps, its API and its store."
publish = false

[[bin]]
name = "yenbot"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.7.9", features = ["macros", "ws"] }
include_dir = "0.7.4"
regex = "1.12.3"
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }
