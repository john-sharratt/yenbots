[package]
name = "yenbot"
version = "0.1.0"
edition = "2021"
description = "Yen Bots — the app-hosting site at yenbot.com.au: one binary serving the platform, its apps, its API and its store."
publish = false

[[bin]]
name = "yenbot"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
getrandom = "0.3"
axum = { version = "0.7.9", features = ["macros", "ws"] }
include_dir = "0.7.4"
regex = "1.12.3"
rusqlite = { version = "0.31.0", features = ["bundled", "backup"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tokio = { version = "1.52.3", features = ["full"] }
# The gateway's bus, subscribed to over a WebSocket (src/publish/bus.rs).
tokio-tungstenite = { version = "0.24", features = ["connect"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1"
# The platform's and the apps' files, gzipped for a browser that takes it.
flate2 = "1"
# The embedded JavaScript engine: the check compiles every workflow in it
# (src/check/rules/workflows.rs), and the framework's tests run in it.
rquickjs = { version = "0.14.0", features = ["loader"] }
# The art library's pictures, read as PNG, sized, and encoded as lossy WebP
# by libwebp on load (src/library/sizing.rs).
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
webp = { version = "0.3", default-features = false }

[build-dependencies]
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }
